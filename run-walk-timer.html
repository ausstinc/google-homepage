<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Run/Walk Interval Timer</title>
<style>
  :root {
    --bg: #10131a;
    --bg-panel: #1b2029;
    --text: #f4f6f8;
    --text-dim: #9aa4b2;
    --accent: #4f8cff;
    --border: #2a3140;

    --warmup: #d9a521;
    --run: #1fae5c;
    --walk: #2f7de1;
    --done: #6b5bd6;

    --warmup-dark: #8a6b12;
    --run-dark: #12693a;
    --walk-dark: #1c4e8f;
  }

  :root.light {
    --bg: #f2f4f7;
    --bg-panel: #ffffff;
    --text: #14181f;
    --text-dim: #5a6473;
    --border: #dde1e8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    user-select: none;
    transition: background-color 0.4s ease;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- Top bar ---------- */
  #topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.4rem;
    padding: 8px;
    cursor: pointer;
    line-height: 1;
    border-radius: 8px;
  }
  .icon-btn:active { background: rgba(128,128,128,0.2); }

  #history-note {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
    flex: 1;
    padding: 0 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- Main stage ---------- */
  #stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px 16px 30px;
    transition: background-color 0.5s ease;
    border-radius: 0;
  }

  #stage.phase-warmup, #stage.phase-cooldown { background-color: var(--warmup); }
  #stage.phase-run { background-color: var(--run); }
  #stage.phase-walk { background-color: var(--walk); }
  #stage.phase-done { background-color: var(--done); }
  #stage.phase-idle { background-color: transparent; }

  #stage.has-color #phase-label,
  #stage.has-color #time-remaining,
  #stage.has-color #rep-counter,
  #stage.has-color #next-phase,
  #stage.has-color #total-time {
    color: #0b0d10;
    text-shadow: 0 1px 2px rgba(255,255,255,0.15);
  }

  #phase-label {
    font-size: clamp(2rem, 11vw, 4.5rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0 0 4px;
  }

  #time-remaining {
    font-size: clamp(5rem, 32vw, 13rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin: 0;
    font-family: "SF Mono", "Roboto Mono", Consolas, monospace;
  }

  #rep-counter {
    font-size: clamp(1.1rem, 5.5vw, 2rem);
    font-weight: 600;
    margin-top: 10px;
    color: var(--text-dim);
  }

  #next-phase {
    font-size: clamp(1rem, 4.5vw, 1.6rem);
    margin-top: 6px;
    color: var(--text-dim);
    font-weight: 600;
  }

  #next-phase b { text-transform: uppercase; }

  #total-time {
    font-size: clamp(0.95rem, 4vw, 1.3rem);
    color: var(--text-dim);
    margin-top: 22px;
    font-variant-numeric: tabular-nums;
  }

  #idle-message {
    font-size: clamp(1.3rem, 6vw, 2.2rem);
    font-weight: 700;
    margin-bottom: 8px;
  }
  #idle-sub {
    font-size: clamp(0.9rem, 4vw, 1.2rem);
    color: var(--text-dim);
    max-width: 30em;
    line-height: 1.5;
  }

  /* ---------- Controls ---------- */
  #controls {
    display: flex;
    gap: 14px;
    justify-content: center;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

  button.big-btn {
    flex: 1;
    max-width: 220px;
    padding: 20px 10px;
    font-size: clamp(1.1rem, 5vw, 1.5rem);
    font-weight: 700;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  button.big-btn:active { transform: scale(0.97); }

  #btn-start { background: var(--run); color: #fff; }
  #btn-pause { background: var(--accent); color: #fff; }
  #btn-reset { background: transparent; color: var(--text-dim); border: 2px solid var(--border); flex: 0 0 auto; max-width: none; padding: 20px 22px; }

  .hidden { display: none !important; }

  /* ---------- Settings panel ---------- */
  #settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  #settings-panel {
    background: var(--bg-panel);
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 20px 22px calc(24px + env(safe-area-inset-bottom));
    max-height: 85vh;
    overflow-y: auto;
  }
  #settings-panel h2 {
    margin: 0 0 14px;
    font-size: 1.3rem;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .setting-row label { font-size: 1rem; }
  .setting-row input[type=number] {
    width: 80px;
    padding: 8px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    text-align: center;
  }
  .setting-row input[type=range] { width: 130px; }
  #settings-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  #settings-actions button {
    flex: 1;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }
  #settings-save { background: var(--accent); color: #fff; }
  #settings-cancel { background: transparent; color: var(--text-dim); border: 2px solid var(--border); }
  #settings-note {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 10px;
  }
  #settings-locked {
    font-size: 0.85rem;
    color: var(--warmup);
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div id="topbar">
  <button class="icon-btn" id="btn-settings" aria-label="Settings">&#9881;&#65039;</button>
  <div id="history-note"></div>
  <button class="icon-btn" id="btn-theme" aria-label="Toggle dark mode">&#127769;</button>
</div>

<div id="stage" class="phase-idle">
  <div id="idle-view">
    <div id="idle-message">Ready to run</div>
    <div id="idle-sub">Warm-up walk &rarr; 8x (1 min run / 2 min walk) &rarr; cool-down walk</div>
  </div>

  <div id="active-view" class="hidden">
    <div id="phase-label">Run</div>
    <div id="time-remaining">0:00</div>
    <div id="rep-counter">Rep 1/8</div>
    <div id="next-phase">Next: <b>Walk</b></div>
    <div id="total-time">Total: 0:00</div>
  </div>
</div>

<div id="controls">
  <button class="big-btn" id="btn-start">Start</button>
  <button class="big-btn hidden" id="btn-pause">Pause</button>
  <button class="big-btn" id="btn-reset">Reset</button>
</div>

<div id="settings-overlay" class="hidden">
  <div id="settings-panel">
    <h2>Workout Settings</h2>
    <div id="settings-locked" class="hidden">Pause or reset the workout to change intervals.</div>

    <div class="setting-row">
      <label for="set-warmup">Warm-up walk (min)</label>
      <input type="number" id="set-warmup" min="0" max="30" step="0.5">
    </div>
    <div class="setting-row">
      <label for="set-run">Run interval (min)</label>
      <input type="number" id="set-run" min="0.25" max="30" step="0.25">
    </div>
    <div class="setting-row">
      <label for="set-walk">Walk interval (min)</label>
      <input type="number" id="set-walk" min="0.25" max="30" step="0.25">
    </div>
    <div class="setting-row">
      <label for="set-reps">Repetitions</label>
      <input type="number" id="set-reps" min="1" max="30" step="1">
    </div>
    <div class="setting-row">
      <label for="set-cooldown">Cool-down walk (min)</label>
      <input type="number" id="set-cooldown" min="0" max="30" step="0.5">
    </div>
    <div class="setting-row">
      <label for="set-volume">Alert volume</label>
      <input type="range" id="set-volume" min="0" max="100" step="5">
    </div>

    <div id="settings-actions">
      <button id="settings-cancel">Cancel</button>
      <button id="settings-save">Save</button>
    </div>
    <div id="settings-note">Settings are saved on this device for next time.</div>
  </div>
</div>

<audio id="keepalive" loop preload="auto" src="data:audio/wav;base64,UklGRtQEAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YbAEAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=">

<script>
(function () {
  "use strict";

  // ---------------- Defaults & persisted settings ----------------
  var DEFAULTS = { warmup: 3, run: 1, walk: 2, reps: 8, cooldown: 2, volume: 40 };
  var SETTINGS_KEY = "rwTimerSettings";
  var HISTORY_KEY = "rwTimerHistory";

  function loadSettings() {
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return Object.assign({}, DEFAULTS);
      var parsed = JSON.parse(raw);
      return Object.assign({}, DEFAULTS, parsed);
    } catch (e) { return Object.assign({}, DEFAULTS); }
  }
  function saveSettings(s) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
  }
  function pushHistory(entry) {
    var h = loadHistory();
    h.push(entry);
    if (h.length > 20) h = h.slice(h.length - 20);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch (e) {}
  }

  var settings = loadSettings();

  // ---------------- Segment plan ----------------
  function buildSegments(s) {
    var segs = [];
    if (s.warmup > 0) segs.push({ type: "warmup", label: "Warm-up", duration: Math.round(s.warmup * 60) });
    for (var i = 1; i <= s.reps; i++) {
      segs.push({ type: "run", label: "Run", duration: Math.round(s.run * 60), rep: i });
      segs.push({ type: "walk", label: "Walk", duration: Math.round(s.walk * 60), rep: i });
    }
    if (s.cooldown > 0) segs.push({ type: "cooldown", label: "Cool-down", duration: Math.round(s.cooldown * 60) });
    return segs.filter(function (seg) { return seg.duration > 0; });
  }

  var segments = buildSegments(settings);

  // ---------------- State ----------------
  var STATE_IDLE = "idle", STATE_RUNNING = "running", STATE_PAUSED = "paused", STATE_DONE = "done";
  var state = STATE_IDLE;
  var currentIndex = 0;
  var segmentEndTime = 0;      // ms epoch, when current segment ends
  var remainingMsAtPause = 0;
  var workoutStartTime = 0;
  var pausedAccumMs = 0;
  var pauseStartedAt = 0;
  var beepedFlags = {};        // which countdown seconds have already beeped for current segment
  var tickHandle = null;
  var wakeLock = null;

  // ---------------- DOM ----------------
  var $stage = document.getElementById("stage");
  var $idleView = document.getElementById("idle-view");
  var $activeView = document.getElementById("active-view");
  var $phaseLabel = document.getElementById("phase-label");
  var $timeRemaining = document.getElementById("time-remaining");
  var $repCounter = document.getElementById("rep-counter");
  var $nextPhase = document.getElementById("next-phase");
  var $totalTime = document.getElementById("total-time");
  var $btnStart = document.getElementById("btn-start");
  var $btnPause = document.getElementById("btn-pause");
  var $btnReset = document.getElementById("btn-reset");
  var $historyNote = document.getElementById("history-note");
  var $btnTheme = document.getElementById("btn-theme");
  var $btnSettings = document.getElementById("btn-settings");
  var $settingsOverlay = document.getElementById("settings-overlay");
  var $settingsLocked = document.getElementById("settings-locked");
  var $keepalive = document.getElementById("keepalive");

  var $setWarmup = document.getElementById("set-warmup");
  var $setRun = document.getElementById("set-run");
  var $setWalk = document.getElementById("set-walk");
  var $setReps = document.getElementById("set-reps");
  var $setCooldown = document.getElementById("set-cooldown");
  var $setVolume = document.getElementById("set-volume");

  // ---------------- Audio (Web Audio API beeps) ----------------
  var audioCtx = null;
  function ensureAudioCtx() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function beep(freq, durationMs, gainLevel) {
    try {
      var ctx = ensureAudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var vol = (settings.volume / 100) * (gainLevel != null ? gainLevel : 1) * 0.35;
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.01);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + durationMs / 1000);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + durationMs / 1000 + 0.02);
    } catch (e) {}
  }

  function playCountdownTick() { beep(880, 120, 0.8); }
  function playPhaseChange(toType) {
    if (toType === "run") { beep(660, 140, 1); setTimeout(function () { beep(990, 180, 1); }, 150); }
    else { beep(500, 220, 1); }
  }
  function playComplete() {
    var notes = [523, 659, 784, 1047];
    notes.forEach(function (f, i) {
      setTimeout(function () { beep(f, 220, 1); }, i * 180);
    });
  }

  // ---------------- Formatting ----------------
  function fmtClock(totalSeconds) {
    totalSeconds = Math.max(0, Math.round(totalSeconds));
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function fmtNum(n) {
    return (Math.round(n * 100) / 100).toString();
  }

  function phaseClass(type) {
    if (type === "warmup" || type === "cooldown") return "phase-warmup";
    if (type === "run") return "phase-run";
    if (type === "walk") return "phase-walk";
    return "phase-idle";
  }

  // ---------------- Wake lock ----------------
  function requestWakeLock() {
    if ("wakeLock" in navigator) {
      navigator.wakeLock.request("screen").then(function (wl) {
        wakeLock = wl;
        wakeLock.addEventListener("release", function () { wakeLock = null; });
      }).catch(function () {});
    }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state === STATE_RUNNING) requestWakeLock();
  });

  // ---------------- Media session (lock screen / headset controls) ----------------
  function setupMediaSession() {
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "Run/Walk Timer",
        artist: "Ready",
        album: "Interval Training"
      });
      navigator.mediaSession.setActionHandler("play", function () { toggleStartPause(); });
      navigator.mediaSession.setActionHandler("pause", function () { toggleStartPause(); });
    } catch (e) {}
  }
  function updateMediaSession(text) {
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: text,
        artist: "Run/Walk Timer",
        album: "Interval Training"
      });
      navigator.mediaSession.playbackState = state === STATE_RUNNING ? "playing" : "paused";
    } catch (e) {}
  }

  function startKeepalive() {
    $keepalive.volume = 0;
    var p = $keepalive.play();
    if (p && p.catch) p.catch(function () {});
  }
  function stopKeepalive() {
    $keepalive.pause();
  }

  // ---------------- Render ----------------
  function renderIdleOrDone(doneMsg) {
    $idleView.classList.remove("hidden");
    $activeView.classList.add("hidden");
    $stage.className = "phase-idle";
    $stage.classList.remove("has-color");
    document.getElementById("idle-message").textContent = doneMsg || "Ready to run";
    if (doneMsg) {
      document.getElementById("idle-sub").textContent = "Great job! Tap Start to go again.";
    } else {
      document.getElementById("idle-sub").innerHTML = "Warm-up walk &rarr; " + settings.reps + "x (" +
        fmtNum(settings.run) + " min run / " + fmtNum(settings.walk) + " min walk) &rarr; cool-down walk";
    }
  }

  function renderActive() {
    $idleView.classList.add("hidden");
    $activeView.classList.remove("hidden");
    var seg = segments[currentIndex];
    $stage.className = "stage " + phaseClass(seg.type) + " has-color";
    $phaseLabel.textContent = seg.type === "warmup" || seg.type === "cooldown" ? seg.label : seg.label;

    var next = segments[currentIndex + 1];
    if (next) {
      $nextPhase.innerHTML = "Next: <b>" + next.label + "</b>";
    } else {
      $nextPhase.innerHTML = "Next: <b>Finish!</b>";
    }

    if (seg.type === "run" || seg.type === "walk") {
      $repCounter.textContent = "Rep " + seg.rep + "/" + settings.reps;
      $repCounter.style.display = "";
    } else {
      $repCounter.style.display = "none";
    }
  }

  function totalPlannedSeconds() {
    return segments.reduce(function (sum, s) { return sum + s.duration; }, 0);
  }

  // ---------------- Core loop ----------------
  function tick() {
    if (state !== STATE_RUNNING) return;
    var now = Date.now();
    var seg = segments[currentIndex];
    var remainingMs = segmentEndTime - now;
    var remainingSec = Math.ceil(remainingMs / 1000);

    if (remainingMs <= 0) {
      advanceSegment();
      return;
    }

    $timeRemaining.textContent = fmtClock(remainingMs / 1000);

    var totalElapsedSec = (now - workoutStartTime - pausedAccumMs) / 1000;
    $totalTime.textContent = "Total: " + fmtClock(totalElapsedSec) + " / " + fmtClock(totalPlannedSeconds());

    if (remainingSec <= 3 && remainingSec >= 1 && !beepedFlags[remainingSec]) {
      beepedFlags[remainingSec] = true;
      playCountdownTick();
    }

    updateMediaSession(seg.label + " — " + fmtClock(remainingMs / 1000));
  }

  function advanceSegment() {
    currentIndex++;
    beepedFlags = {};
    if (currentIndex >= segments.length) {
      finishWorkout();
      return;
    }
    var seg = segments[currentIndex];
    segmentEndTime = Date.now() + seg.duration * 1000;
    playPhaseChange(seg.type);
    renderActive();
    tick();
  }

  function finishWorkout() {
    state = STATE_DONE;
    stopTicking();
    releaseWakeLock();
    playComplete();
    var totalSec = Math.round((Date.now() - workoutStartTime - pausedAccumMs) / 1000);
    pushHistory({ date: new Date().toISOString(), totalSeconds: totalSec, reps: settings.reps });
    updateHistoryNote();
    renderIdleOrDone("Workout complete!");
    document.getElementById("idle-sub").textContent = "Total time: " + fmtClock(totalSec) + " — saved.";
    $btnStart.textContent = "Start";
    $btnStart.classList.remove("hidden");
    $btnPause.classList.add("hidden");
    updateMediaSession("Workout complete");
    stopKeepalive();
  }

  function startTicking() {
    if (tickHandle) return;
    tickHandle = setInterval(tick, 200);
  }
  function stopTicking() {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  }

  // ---------------- Controls ----------------
  function startWorkout() {
    ensureAudioCtx();
    if (state === STATE_DONE || state === STATE_IDLE) {
      segments = buildSegments(settings);
      if (segments.length === 0) return;
      currentIndex = 0;
      workoutStartTime = Date.now();
      pausedAccumMs = 0;
      beepedFlags = {};
      segmentEndTime = Date.now() + segments[0].duration * 1000;
      playPhaseChange(segments[0].type);
    } else if (state === STATE_PAUSED) {
      var pausedFor = Date.now() - pauseStartedAt;
      pausedAccumMs += pausedFor;
      segmentEndTime = Date.now() + remainingMsAtPause;
    }
    state = STATE_RUNNING;
    startTicking();
    requestWakeLock();
    startKeepalive();
    setupMediaSession();
    renderActive();
    tick();

    $btnStart.classList.add("hidden");
    $btnPause.classList.remove("hidden");
    $btnPause.textContent = "Pause";
  }

  function pauseWorkout() {
    if (state !== STATE_RUNNING) return;
    state = STATE_PAUSED;
    pauseStartedAt = Date.now();
    remainingMsAtPause = segmentEndTime - Date.now();
    stopTicking();
    releaseWakeLock();
    updateMediaSession("Paused");
    $btnPause.classList.add("hidden");
    $btnStart.classList.remove("hidden");
    $btnStart.textContent = "Resume";
  }

  function toggleStartPause() {
    if (state === STATE_RUNNING) pauseWorkout();
    else startWorkout();
  }

  function resetWorkout() {
    stopTicking();
    releaseWakeLock();
    stopKeepalive();
    state = STATE_IDLE;
    currentIndex = 0;
    segments = buildSegments(settings);
    renderIdleOrDone();
    $btnStart.textContent = "Start";
    $btnStart.classList.remove("hidden");
    $btnPause.classList.add("hidden");
    updateMediaSession("Ready");
  }

  $btnStart.addEventListener("click", startWorkout);
  $btnPause.addEventListener("click", pauseWorkout);
  $btnReset.addEventListener("click", function () {
    if (state === STATE_RUNNING || state === STATE_PAUSED) {
      if (!confirm("Reset the current workout?")) return;
    }
    resetWorkout();
  });

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") {
      e.preventDefault();
      if (state === STATE_DONE || state === STATE_IDLE || state === STATE_PAUSED) startWorkout();
      else toggleStartPause();
    }
  });

  // ---------------- Theme ----------------
  function applyTheme(mode) {
    document.documentElement.classList.toggle("light", mode === "light");
    try { localStorage.setItem("rwTimerTheme", mode); } catch (e) {}
  }
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem("rwTimerTheme"); } catch (e) {}
    if (saved) { applyTheme(saved); }
    else {
      var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      applyTheme(prefersLight ? "light" : "dark");
    }
  })();
  $btnTheme.addEventListener("click", function () {
    var isLight = document.documentElement.classList.contains("light");
    applyTheme(isLight ? "dark" : "light");
  });

  // ---------------- Settings panel ----------------
  function openSettings() {
    $setWarmup.value = settings.warmup;
    $setRun.value = settings.run;
    $setWalk.value = settings.walk;
    $setReps.value = settings.reps;
    $setCooldown.value = settings.cooldown;
    $setVolume.value = settings.volume;
    var locked = state === STATE_RUNNING;
    $settingsLocked.classList.toggle("hidden", !locked);
    [$setWarmup, $setRun, $setWalk, $setReps, $setCooldown].forEach(function (el) {
      el.disabled = locked;
    });
    $settingsOverlay.classList.remove("hidden");
  }
  function closeSettings() { $settingsOverlay.classList.add("hidden"); }

  $btnSettings.addEventListener("click", openSettings);
  document.getElementById("settings-cancel").addEventListener("click", closeSettings);
  $settingsOverlay.addEventListener("click", function (e) {
    if (e.target === $settingsOverlay) closeSettings();
  });

  document.getElementById("settings-save").addEventListener("click", function () {
    if (state === STATE_RUNNING) { closeSettings(); return; }
    var next = {
      warmup: clampNum($setWarmup.value, 0, 30, DEFAULTS.warmup),
      run: clampNum($setRun.value, 0.25, 30, DEFAULTS.run),
      walk: clampNum($setWalk.value, 0.25, 30, DEFAULTS.walk),
      reps: clampNum($setReps.value, 1, 30, DEFAULTS.reps, true),
      cooldown: clampNum($setCooldown.value, 0, 30, DEFAULTS.cooldown),
      volume: clampNum($setVolume.value, 0, 100, DEFAULTS.volume, true)
    };
    settings = next;
    saveSettings(settings);
    segments = buildSegments(settings);
    currentIndex = 0;
    state = STATE_IDLE;
    renderIdleOrDone();
    closeSettings();
  });

  function clampNum(val, min, max, fallback, isInt) {
    var n = parseFloat(val);
    if (isNaN(n)) n = fallback;
    n = Math.min(max, Math.max(min, n));
    return isInt ? Math.round(n) : Math.round(n * 100) / 100;
  }

  // ---------------- History note ----------------
  function updateHistoryNote() {
    var h = loadHistory();
    if (h.length === 0) { $historyNote.textContent = ""; return; }
    var last = h[h.length - 1];
    var d = new Date(last.date);
    var dateStr = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    $historyNote.textContent = "Last: " + dateStr + " — " + fmtClock(last.totalSeconds);
  }

  // ---------------- Prevent accidental navigation while running ----------------
  window.addEventListener("beforeunload", function (e) {
    if (state === STATE_RUNNING || state === STATE_PAUSED) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  // ---------------- Init ----------------
  renderIdleOrDone();
  updateHistoryNote();
  setupMediaSession();
})();
</script>
</body>
</html>
